name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The runner's display is 1024x768, too small for the first-run widgets; the app smoke test checks placement on a real desktop size.
      - name: Desktop resolution 1920x1080
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
        continue-on-error: true
      - name: Unit tests (engine + registry)
        run: npm test
      - name: Validate gallery manifests
        run: npm run validate
      - name: Load every gallery widget in Electron
        run: npm run test:widgets
      - name: End-to-end app smoke test
        run: npm run test:app
      - name: Upgrade-from-old-release smoke test
        run: npm run test:migration
