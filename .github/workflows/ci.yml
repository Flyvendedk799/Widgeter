name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (engine + registry)
        run: npm test
      - name: Validate gallery manifests
        run: npm run validate
      - name: Load every gallery widget in Electron
        run: npm run test:widgets
      - name: End-to-end app smoke test
        run: npm run test:app
