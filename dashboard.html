<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widgeter Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #89b4fa;
            margin-top: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .widget-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        .widget-card {
            background-color: #313244;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .widget-info h3 {
            margin: 0 0 5px 0;
            color: #f5c2e7;
        }
        .widget-info p {
            margin: 0;
            font-size: 0.9em;
            color: #a6adc8;
        }
        .widget-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #45475a;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #a6e3a1;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        .btn {
            background-color: #89b4fa;
            color: #11111b;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #b4befe;
        }
        .btn-settings {
            background-color: #f9e2af;
        }
        .btn-settings:hover {
            background-color: #f5e0dc;
        }
        .drop-zone {
            border: 2px dashed #6c7086;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            color: #a6adc8;
            transition: border-color 0.3s, background-color 0.3s;
            margin-bottom: 20px;
        }
        .drop-zone.dragover {
            border-color: #89b4fa;
            background-color: rgba(137, 180, 250, 0.1);
        }
        .settings-panel {
            display: none;
            background-color: #181825;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 4px solid #f9e2af;
        }
        .settings-panel.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #cdd6f4;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #45475a;
            background-color: #313244;
            color: #cdd6f4;
            box-sizing: border-box;
        }
        .system-settings {
            background-color: #313244;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .btn-setup {
            background-color: #cba6f7;
        }
        .btn-setup:hover {
            background-color: #b4befe;
        }
        .setup-panel {
            display: none;
            background-color: #181825;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 4px solid #cba6f7;
        }
        .setup-panel.active {
            display: block;
        }
        .setup-panel h4 {
            color: #cba6f7;
            margin: 0 0 10px 0;
            font-size: 1em;
        }
        .setup-panel .setup-description {
            color: #a6adc8;
            font-size: 0.85em;
            margin-bottom: 12px;
        }
        .setup-panel .form-group {
            margin-bottom: 12px;
        }
        .setup-panel .form-group label {
            display: block;
            margin-bottom: 4px;
            color: #cdd6f4;
            font-size: 0.9em;
        }
        .setup-panel .form-group input {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #45475a;
            background-color: #313244;
            color: #cdd6f4;
            box-sizing: border-box;
            font-family: inherit;
        }
        .setup-panel .form-group .hint {
            font-size: 0.8em;
            color: #6c7086;
            margin-top: 3px;
        }
        .setup-panel .form-group .hint a {
            color: #89b4fa;
            text-decoration: none;
        }
        .setup-panel .form-group .hint a:hover {
            text-decoration: underline;
        }
        .setup-panel .test-result {
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.85em;
            margin-bottom: 10px;
        }
        .setup-panel .test-result.success {
            background-color: rgba(166, 227, 161, 0.1);
            border: 1px solid rgba(166, 227, 161, 0.3);
            color: #a6e3a1;
        }
        .setup-panel .test-result.error {
            background-color: rgba(243, 139, 168, 0.1);
            border: 1px solid rgba(243, 139, 168, 0.3);
            color: #f38ba8;
        }
        .setup-panel .setup-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Widgeter Dashboard</h1>
            <button id="marketplace-btn" class="btn" style="background-color: #a6e3a1; color: #1e1e2e; font-weight: bold; padding: 10px 20px; font-size: 16px;">🌐 Marketplace</button>
        </div>
        <div class="system-settings">
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                <div class="toggle-switch">
                    <input type="checkbox" id="launch-on-boot">
                    <span class="slider"></span>
                </div>
                Launch on Windows Boot (minimized to tray)
            </label>
        </div>

        <div id="drop-zone" class="drop-zone">
            Drag and drop a .widget file here to install
        </div>

        <h2>Installed Widgets</h2>
        <div id="widget-list" class="widget-list">
            <!-- Widgets will be injected here -->
        </div>
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
