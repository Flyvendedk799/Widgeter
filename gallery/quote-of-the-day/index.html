<div class="wg-header">
  <div class="wg-header-main">
    <span class="wg-icon">💬</span>
    <div class="wg-grow">
      <div class="wg-title">Quote of the Day</div>
      <div class="wg-sub wg-truncate" id="sub">&nbsp;</div>
    </div>
  </div>
  <div class="wg-inline" style="gap:4px">
    <button class="wg-btn icon" id="copy" title="Copy quote">⧉</button>
    <button class="wg-btn" id="new" title="Show another quote">New ↻</button>
  </div>
</div>
<div class="wg-card quote" id="q">
  <div class="wg-skeleton" style="margin-bottom:8px"></div>
  <div class="wg-skeleton" style="width:85%;margin-bottom:8px"></div>
  <div class="wg-skeleton" style="width:55%"></div>
</div>
