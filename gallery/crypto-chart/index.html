<div class="wg-header">
  <div class="wg-header-main">
    <span class="wg-icon">📈</span>
    <div class="wg-grow">
      <div class="wg-title wg-truncate" id="pair">Crypto Chart</div>
      <div class="wg-sub wg-truncate" id="sub">Binance spot</div>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="wg-btn sm" data-i="15m">15m</button>
    <button class="wg-btn sm" data-i="1h">1h</button>
    <button class="wg-btn sm" data-i="4h">4h</button>
    <button class="wg-btn sm" data-i="1d">1d</button>
  </div>
</div>

<div class="wg-spread price-line">
  <div class="wg-big-sm" id="price">–</div>
  <span class="wg-badge" id="chg">–</span>
</div>

<div class="chart-wrap" id="wrap">
  <canvas id="chart"></canvas>
  <div class="hover" id="hover"></div>
</div>

<div class="wg-grid-3 stats">
  <div><div class="wg-caption">24h high</div><div class="wg-val stat" id="hi">–</div></div>
  <div><div class="wg-caption">24h low</div><div class="wg-val stat" id="lo">–</div></div>
  <div><div class="wg-caption">24h volume</div><div class="wg-val stat" id="vol">–</div></div>
</div>

<div class="wg-card book" id="book">
  <div class="wg-spread bk-head"><span class="wg-caption">Order book</span><span class="wg-caption" id="spread"></span></div>
  <div class="bk-cols">
    <div id="bids"></div>
    <div id="asks"></div>
  </div>
</div>
<div class="wg-err" id="err" hidden></div>
