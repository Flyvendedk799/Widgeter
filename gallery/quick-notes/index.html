<div class="wg-header">
  <div class="wg-header-main">
    <span class="wg-icon">📝</span>
    <div class="wg-truncate">
      <div class="wg-title">Quick Notes</div>
      <div class="wg-sub" id="qn-count">0 words · 0 chars</div>
    </div>
  </div>
  <div class="wg-inline">
    <button class="wg-btn sm" id="qn-copy" title="Copy all text">Copy</button>
    <button class="wg-btn sm danger" id="qn-clear" title="Delete all text">Clear</button>
  </div>
</div>
<textarea class="wg-input no-drag" id="qn-text" spellcheck="false" placeholder="Type your notes here…"></textarea>
<div class="qn-status" id="qn-status">Saved automatically</div>
