<div class="wg-header">
  <div class="wg-header-main">
    <span class="wg-icon">🍅</span>
    <div class="wg-truncate">
      <div class="wg-title">Pomodoro</div>
      <div class="wg-sub" id="pt-mode">Focus session</div>
    </div>
  </div>
  <span class="wg-badge accent" id="pt-cnt" title="Focus sessions finished today">0 today</span>
</div>
<div class="pt-ring">
  <svg width="150" height="150" viewBox="0 0 150 150">
    <circle class="pt-track" cx="75" cy="75" r="65" fill="none" stroke-width="8"/>
    <circle class="pt-arc" id="pt-arc" cx="75" cy="75" r="65" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="408.41" stroke-dashoffset="408.41"/>
  </svg>
  <div class="pt-center">
    <div class="pt-time" id="pt-time">25:00</div>
    <div class="pt-sub" id="pt-sub">Ready</div>
  </div>
</div>
<div class="pt-dots" id="pt-dots"></div>
<div class="pt-actions">
  <button class="wg-btn primary no-drag" id="pt-start">▶ Start</button>
  <button class="wg-btn no-drag" id="pt-reset">↺ Reset</button>
  <button class="wg-btn no-drag" id="pt-skip">⏭ Skip</button>
</div>
