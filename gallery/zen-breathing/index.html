<div class="wg-header">
  <div class="wg-header-main">
    <span class="wg-icon" title="Zen Breathing">
      <span class="zb-emoji" aria-hidden="true">🧘</span>
      <svg class="zb-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3c-1.5 3.5-5 6.5-8 7.5 2 4.5 5 8 8 10.5 3-2.5 6-6 8-10.5-3-1-6.5-4-8-7.5Z" />
        <path d="M12 7c-1 2.5-3 4.5-5 5.5 1.5 3 3.5 5.5 5 7 1.5-1.5 3.5-4 5-7-2-1-4-3-5-5.5Z" />
      </svg>
    </span>
    <div class="wg-truncate">
      <div class="wg-title">Zen Breathing</div>
      <div class="wg-sub" id="zb-pattern" title="Click to change technique">Relax (4-7-8)</div>
    </div>
  </div>
  <span class="wg-badge accent" id="zb-cycles" title="Completed breathing cycles">0 cycles</span>
</div>

<div class="zb-container">
  <div class="wg-radial-wrap zb-ring-wrap" id="zb-ring-wrap" title="Click to pause or resume">
    <div class="zb-halo" id="zb-halo"></div>
    <svg class="zb-svg" width="136" height="136" viewBox="0 0 136 136">
      <circle class="zb-track" cx="68" cy="68" r="56" fill="none" stroke-width="7" />
      <circle class="zb-arc" id="zb-arc" cx="68" cy="68" r="56" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="351.86" stroke-dashoffset="351.86" />
    </svg>
    <div class="zb-center">
      <div class="zb-phase" id="zb-phase">Inhale</div>
      <div class="zb-time" id="zb-time">4s</div>
      <div class="zb-guide" id="zb-guide">Breathe in slowly</div>
    </div>
  </div>

  <div class="zb-actions">
    <button class="wg-btn primary sm no-drag" id="zb-toggle">
      <svg class="zb-btn-icon" id="zb-toggle-icon" width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
        <rect x="5" y="4" width="4" height="16" rx="1" />
        <rect x="15" y="4" width="4" height="16" rx="1" />
      </svg>
      <span id="zb-toggle-lbl">Pause</span>
    </button>
    <button class="wg-btn sm no-drag" id="zb-reset" title="Reset cycle counter and timer">
      <svg class="zb-btn-icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </svg>
      <span>Reset</span>
    </button>
    <button class="wg-btn sm icon no-drag" id="zb-sound" title="Toggle audio chime">
      <svg class="zb-btn-icon" id="zb-sound-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        <line x1="2" y1="2" x2="22" y2="22" />
      </svg>
    </button>
  </div>
</div>
