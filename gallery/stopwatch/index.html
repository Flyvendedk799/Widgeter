<div class="wg-header">
  <div class="wg-header-main">
    <span class="wg-icon">⏱️</span>
    <div class="wg-truncate">
      <div class="wg-title">Stopwatch</div>
      <div class="wg-sub" id="sw-sub">Ready</div>
    </div>
  </div>
  <button class="wg-btn sm" id="sw-reset">Reset</button>
</div>
<div class="sw-time" id="sw-time">00:00.00</div>
<div class="sw-actions">
  <button class="wg-btn primary no-drag" id="sw-toggle">▶ Start</button>
  <button class="wg-btn no-drag" id="sw-lap" disabled>⚑ Lap</button>
</div>
<div class="wg-list sw-laps" id="sw-laps"></div>
