<!DOCTYPE html>
<html>
<head>
    <title>Widgeter Marketplace</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            margin: 0;
            padding: 20px;
        }
        h2 { margin-top: 0; color: #89b4fa; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #45475a; padding-bottom: 15px; margin-bottom: 20px; }
        .btn {
            background-color: #89b4fa; color: #1e1e2e;
            border: none; padding: 8px 16px; border-radius: 4px;
            cursor: pointer; font-weight: bold;
        }
        .btn:hover { opacity: 0.9; }
        .btn-upload { background-color: #a6e3a1; }
        #widget-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background-color: #313244; padding: 15px; border-radius: 8px; border: 1px solid #45475a; }
        .card h3 { margin: 0 0 10px 0; color: #f38ba8; }
        .card p { font-size: 14px; margin: 0 0 15px 0; color: #a6adc8; }
        .card .author { font-size: 12px; color: #6c7086; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Widgeter Marketplace</h2>
        <div>
            <input type="file" id="upload-file" style="display: none;" accept=".widget,.json" />
            <button id="upload-btn" class="btn btn-upload">Upload Widget</button>
        </div>
    </div>
    <div id="widget-list">Loading widgets...</div>
    <script src="./marketplace.js"></script>
</body>
</html>
